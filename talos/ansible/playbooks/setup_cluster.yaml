---
- name: Set up Talos cluster
  hosts: localhost
  vars:
    project_root: "{{ playbook_dir | dirname }}"
  tasks:
    - name: Check if Talos secrets already exist
      ansible.builtin.stat:
        path: "{{ project_root }}/secrets.yaml"
      register: secrets_file
      changed_when: false
      ignore_errors: true

    - name: Fail secrets.yaml not found
      ansible.builtin.fail:
        msg: "Talos secrets.yaml file not found. Cannot add worker nodes without existing cluster."
      when: >
        not secrets_file.stat.exists

    - name: Generate Talos secrets
      ansible.builtin.command:
        chdir: "{{ project_root }}"
        cmd: talosctl gen secrets
      changed_when: true
      when: not secrets_file.stat.exists

    - name: Create ecr-credential-provider patch file
      ansible.builtin.template:
        src: "{{ project_root }}/templates/ecr-credential-provider.yaml.j2"
        dest: "{{ project_root }}/patches/ecr-credential-provider.yaml"
        mode: "0644"

    - name: Generate Talos configuration
      ansible.builtin.command:
        chdir: "{{ project_root }}"
        cmd: |
          talosctl gen config {{ cluster_name }} https://{{ vip }}:6443 \
            --force \
            --with-secrets secrets.yaml \
            --install-image factory.talos.dev/nocloud-installer/{{ schematic_id }}:v{{ talos_version }} \
            --config-patch @patches/disable-cni.yaml \
            --config-patch @patches/install-disk.yaml \
            --config-patch @patches/interface-names.yaml \
            --config-patch @patches/kubelet-certificates.yaml \
            --config-patch @patches/ecr-credential-provider.yaml \
            --output "_out"
      changed_when: true

    - name: Apply Talos configuration to controlplane nodes
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/apply_config.yaml"
      loop: "{{ groups['controlplane'] }}"
      loop_control:
        loop_var: host_name
      vars:
        host_data: "{{ hostvars[host_name] }}"
        node_type: controlplane

    - name: Apply Talos configuration to worker nodes
      ansible.builtin.include_tasks: "{{ project_root }}/tasks/apply_config.yaml"
      loop: "{{ groups['worker'] }}"
      loop_control:
        loop_var: host_name
      vars:
        host_data: "{{ hostvars[host_name] }}"
        node_type: worker

    - name: Clean up ecr-credential-provider patch file
      ansible.builtin.file:
        path: "{{ project_root }}/patches/ecr-credential-provider.yaml"
        state: absent

    - name: Check if Talos config file already exist
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.talos/config"
      register: talos_config_file
      changed_when: false

    - name: Set up Talos config file (if Talos config file exists)
      ansible.builtin.copy:
        src: "{{ project_root }}/_out/talosconfig"
        dest: "{{ ansible_env.HOME }}/.talos/config"
        mode: "0644"
        force: true
      changed_when: false
      when: not talos_config_file.stat.exists

    - name: Merge Talos config file (if Talos config file doesn't exist)
      ansible.builtin.command:
        cmd: talosctl config merge {{ project_root }}/_out/talosconfig
      changed_when: false
      when: talos_config_file.stat.exists

    - name: Get Talos endpoints
      ansible.builtin.set_fact:
        talos_endpoints: "{{ groups['controlplane'] | map('extract', hostvars, 'ip') | join(' ') }}"

    - name: Configure Talos endpoints
      ansible.builtin.command:
        cmd: |
          talosctl config endpoints {{ talos_endpoints }}
      changed_when: false

    - name: Configure Talos default node
      ansible.builtin.command:
        cmd: |
          talosctl config node {{ hostvars[groups['controlplane'][0]].ip }}
      changed_when: false

    - name: Wait for Talos to be ready
      ansible.builtin.pause:
        minutes: 3
        prompt: "Waiting for Talos to be ready. Press Ctrl+C to abort."
      changed_when: false

    - name: Bootstrap Talos cluster
      ansible.builtin.command:
        cmd: talosctl bootstrap
      changed_when: false

    - name: Retrieve kubeconfig
      ansible.builtin.command:
        cmd: talosctl kubeconfig -f ~/.kube/config
      changed_when: false

    - name: Wait for all Talos nodes to join cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: nodes
      until: nodes.resources | length == ((groups['controlplane'] | length) + (groups['worker'] | length))
      retries: 60
      delay: 10

    - name: Add Cilium Helm repository
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/

    - name: Install Cilium CNI
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        release_namespace: kube-system
        create_namespace: true
        values: "{{ base_cilium_values | combine(cilium_ingress_block if enable_cilium_ingress else {}, recursive=True) }}"
      vars:
        base_cilium_values:
          ipam:
            mode: kubernetes
          kubeProxyReplacement: true
          operator:
            replicas: 2
          securityContext:
            capabilities:
              ciliumAgent:
                - CHOWN
                - KILL
                - NET_ADMIN
                - NET_RAW
                - IPC_LOCK
                - SYS_ADMIN
                - SYS_RESOURCE
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
              cleanCiliumState:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_RESOURCE
          cgroup:
            autoMount:
              enabled: false
            hostRoot: /sys/fs/cgroup
          l2announcements:
            enabled: true
          externalIPs:
            enabled: true
          devices: "eth+"
          k8sServiceHost: "localhost"
          k8sServicePort: 7445
          k8sClientRateLimit:
            qps: 25
            burst: 50

        cilium_ingress_block:
          ingressController:
            enabled: true
            default: true
            service:
              type: LoadBalancer

    - name: Wait for all Cilium pods to be ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: kube-system
        label_selectors:
          - "app.kubernetes.io/part-of=cilium"
      register: cilium_pods
      until: >
        cilium_pods.resources | length > 0 and
        cilium_pods.resources |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length == cilium_pods.resources | length
      retries: 30
      delay: 10

    - name: Run Cilium connectivity test
      ansible.builtin.command:
        cmd: cilium connectivity test --namespace-labels pod-security.kubernetes.io/enforce=privileged
      register: connectivity_test
      failed_when: connectivity_test.rc != 0
      changed_when: false
      when: not skip_cilium_connectivity_check | default(false)

    - name: Delete cilium-test-1 namespace (created by connectivity test)
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: cilium-test-1
        state: absent
        wait: true
        wait_timeout: 300
      when: not skip_cilium_connectivity_check | default(false)

    - name: Create default Cilium L2 Announcement Policy
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cilium.io/v2alpha1
          kind: CiliumL2AnnouncementPolicy
          metadata:
            name: default-l2-announcement-policy
            namespace: kube-system
          spec:
            interfaces:
              - ^eth[0-9]+$
            externalIPs: true
            loadBalancerIPs: true

    - name: Wait for all nodes to be Ready
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      until: >
        nodes.resources |
        selectattr('status.conditions', 'defined') |
        map(attribute='status.conditions') |
        flatten |
        selectattr('type', 'equalto', 'Ready') |
        selectattr('status', 'equalto', 'True') |
        list | length == (groups['controlplane'] | length + groups['worker'] | length)
      retries: 60
      delay: 10

    - name: Install Local Path storage as a default storage class
      kubernetes.core.helm:
        name: local-path-storage
        chart_ref: oci://dp.apps.rancher.io/charts/local-path-provisioner
        release_namespace: local-path-storage
        create_namespace: true
        state: present
        values:
          storageClass:
            defaultClass: true

    - name: Install k8s sigs metrics server
      kubernetes.core.k8s:
        state: present
        apply: true
        src: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/high-availability-1.21+.yaml
